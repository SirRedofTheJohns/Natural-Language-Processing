name: Tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fast-test dependencies
        run: |
          python -m pip install pytest fastapi httpx torch transformers
          python -m pip install -e . --no-deps
      - name: Run fast tests
        run: python -m pytest -m "not slow"
